services:
  nitter-dev:
    build: .
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./nitter.conf:/src/nitter.conf:ro
      - ./sessions-dev.jsonl:/src/sessions.jsonl:ro

    depends_on:
      - redis-dev

    restart: unless-stopped

  redis-dev:
    image: redis:7-alpine

    volumes:
      - nitter-dev-redis:/data

    restart: unless-stopped

volumes:
  nitter-dev-redis: